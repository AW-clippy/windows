[package]
name = "awclippy-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Security",
] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
tray-icon = "0.19"
dotenvy = "0.15"
mdns-sd = "0.11"
hex = "0.4"
open = "5.0"
tokio-tungstenite = "0.24"
futures-util = "0.3"

[build-dependencies]
embed-resource = "2.4"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
panic = "abort"     # Smaller binary
